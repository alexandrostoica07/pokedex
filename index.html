<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex(151)</title>
    <link rel="stylesheet" href="css.css" />
  </head>
  <body>
    <div>
      <div>
        <h1>Pokedex Prima Generazione</h1>
      </div>

      <div>
        <form id="form">
          <input
            type="text"
            id="pokemon"
            placeholder="Inserisci nome o ID di un pokemon 1-151"
          />
          <button type="submit">Cerca</button>
        </form>
      </div>

      <!-- Info principale -->
      <div id="nome" class="hidden"></div>
      <div id="cry" class="hidden">
        <button id="cry-btn" title="Ascolta il verso">
          🔊 Ascolta il verso
        </button>
      </div>
      <div id="info" class="hidden">
        <p>Altezza: <span id="info-altezza"></span></p>
        <p>Peso: <span id="info-peso"></span></p>
        <p>Tipo: <span id="info-tipo"></span></p>
      </div>

      <!-- Tab -->
      <div id="tabs" class="hidden">
        <input type="radio" name="tab" id="tab-stats" checked />
        <input type="radio" name="tab" id="tab-abilities" />
        <input type="radio" name="tab" id="tab-items" />

        <div id="tab-bar">
          <label for="tab-stats">Statistiche Base</label>
          <label for="tab-abilities">Abilità</label>
          <label for="tab-items">Oggetti Tenuti</label>
        </div>

        <div id="tab-content">
          <!-- Stats: righe generate da template -->
          <div class="panel" id="panel-stats"></div>

          <!-- Abilities -->
          <div class="panel" id="panel-abilities">
            <ul class="tab-list" id="abilities-list"></ul>
            <p id="abilities-empty" class="hidden">Nessuna abilità.</p>
          </div>

          <!-- Held Items -->
          <div class="panel" id="panel-items">
            <ul class="tab-list" id="items-list"></ul>
            <p id="items-empty" class="hidden">Nessun oggetto tenuto.</p>
          </div>
        </div>
      </div>

      <!-- Sprite normali -->
      <div id="sprite" class="hidden">
        <h2>Versione Normale</h2>
        <div id="sprite-list" class="sprite-container"></div>
      </div>

      <!-- Sprite shiny -->
      <div id="shiny" class="hidden">
        <h2>Versione Shiny ✨</h2>
        <div id="shiny-list" class="sprite-container"></div>
      </div>
    </div>

    <!-- Template: riga statistica -->
    <template id="tpl-stat-row">
      <div class="stat-row">
        <span class="stat-name"></span>
        <span class="stat-value"></span>
        <div class="stat-bar">
          <div class="stat-fill"></div>
        </div>
        <span class="stat-star"></span>
      </div>
    </template>

    <!-- Template: abilità -->
    <template id="tpl-ability">
      <li>
        <span class="ability-name"></span>
        <span class="hidden-tag hidden">Nascosta</span>
      </li>
    </template>

    <!-- Template: oggetto tenuto -->
    <template id="tpl-item">
      <li><span class="item-name"></span></li>
    </template>

    <!-- Template: card sprite -->
    <template id="tpl-pokemon-card">
      <div class="pokemon">
        <p class="pokemon-id"></p>
        <img class="pokemon-img" alt="" />
        <p class="pokemon-name"></p>
      </div>
    </template>

    <script src="js.js" type="text/javascript"></script>
  </body>
</html>
